[project]
name = "llm-jp-moshi-mstts-v0c-inference"
version = "0.1.0"
description = "Inference scripts for the llm-jp-moshi-mstts-v0c-zoom1 multi-stream Japanese dialogue TTS model"
requires-python = ">=3.12"
dependencies = [
    "moshi==0.1.0",
    "sentencepiece>=0.2.0",
    "soundfile>=0.12.1",
    "sphn>=0.1.12",
    "huggingface_hub>=0.20",
    "torch>=2.4.1",
    "numpy>=1.26",
    "transformers>=4.46.1",
    "safetensors>=0.4",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'" },
]
